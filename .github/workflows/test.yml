name: Test
on:
  push:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download sources
        uses: actions/checkout@v5
      - name: Set up NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
      - name: Generate sample
        run: |
          npx --yes dummy-json data/sample_data.hbs > frontend/public/sample_data.json
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      - name: Save frontend build for later
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  measure_ecoindex:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download sources
        uses: actions/checkout@v5
      - name: Start application
        uses: ./.github/actions/start
      - name: Install GreenIT Analysis CLI
        run: |
          wget https://github.com/cnumr/GreenIT-Analysis-cli/archive/refs/heads/master.zip
          unzip master.zip
          cd GreenIT-Analysis-cli-master
          npm install
          npm link
      - name: Run GreenIT Analysis CLI
        run: |
          mkdir -p rapports
          greenit analyse --ci scenarios/consulter_horaires.yml rapports/horaires.html
          greenit analyse --ci scenarios/consulter_perturbations.yml rapports/perturbations.html
      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: EcoIndex
          path: rapports/

  measure_energy_consumption:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download sources
        uses: actions/checkout@v5
      - name: Start application
        uses: ./.github/actions/start
      - name: Install GreenFrame CLI
        run: |
          wget https://github.com/benel/greenframe-cli/archive/refs/heads/post-app.zip
          unzip post-app.zip
          cd greenframe-cli-post-app
          npm install -g corepack
          yarn
          yarn build
      - name: Run GreenFrame CLI
        run: |
          ./greenframe-cli-post-app/bin/run analyze > Consumption.txt
      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: Consumption
          path: Consumption.txt
